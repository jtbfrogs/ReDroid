# =============================================================================
#  DROID FIRMWARE — GLOBAL CONFIGURATION
#  Edit this file to change hardware settings, personality, or feature flags.
#  No Python source changes are required to swap personalities or ports.
# =============================================================================

# ---------------------------------------------------------------------------
# SYSTEM — Hardware & Serial Settings
# ---------------------------------------------------------------------------
system:
  port: "/dev/ttyUSB0"            # USB-UART adapter port (Linux: /dev/ttyUSB0 or /dev/ttyACM0)
  baud: 115200                   # Roomba 650 default baud rate
  roomba_timeout: 2.0            # Serial read timeout in seconds
  sensor_poll_interval: 0.1      # Sensor loop frequency in seconds (10 Hz)
  drive_loop_interval: 0.05      # Drive control loop frequency in seconds (20 Hz)
  max_drive_speed: 250           # Hard safety cap on velocity (mm/s). OI max is 500.
  wakeup_pulse_duration: 0.5     # RTS low-pulse duration for Device Detect (seconds)
  wakeup_settle_delay: 1.0       # Time to wait after wake pulse before sending OI commands
  # NOTE: Ensure your USB-UART adapter outputs 3.3V logic on TXD/RXD.
  # The Roomba 650 Mini-DIN serial port is 5V-tolerant on RX but sensitive on power rails.
  # RTS on most CH340/CP2102 adapters is active-LOW at the physical pin level.
  # Device Detect requires a LOW pulse: ser.rts=True drives pin LOW on most TTL adapters.

# ---------------------------------------------------------------------------
# APPEARANCE — Identity Settings
# ---------------------------------------------------------------------------
appearance:
  name: "B2EMO"
  # personality_type: Used by personality.py to tag log output and select reaction set.
  # Options: "b2emo" | "r2d2" | "imperial" | "generic"
  personality_type: "b2emo"

# ---------------------------------------------------------------------------
# TTS — System Audio Speech Synthesis
# Spoken through your PC speakers via pyttsx3 + espeak-ng (not the Roomba).
# Install deps:  sudo apt install espeak-ng  &&  pip install pyttsx3
# ---------------------------------------------------------------------------
tts:
  enabled:     true
  rate:        145      # words per minute — lower is clearer (espeak default ~200)
  volume:      1.0      # 0.0 – 1.0
  voice_index: 0        # 0 = first espeak voice; increment to try others

# ---------------------------------------------------------------------------
# FEATURES — Runtime Feature Flags
# ---------------------------------------------------------------------------
features:
  enable_vision: true            # Set false if no camera is attached
  enable_chat: true              # Set false to disable Ollama AI responses
  enable_drive: true             # Set false for sensor-only / static demo mode
  enable_songs: true             # Set false to silence the Roomba speaker
  camera_index: 0                # 0 = first USB/CSI camera. Try 1 if 0 fails.
  vision_resolution: [640, 480]  # Capture resolution [width, height]
  vision_fps_cap: 15             # Max frames per second for vision thread

# ---------------------------------------------------------------------------
# OLLAMA — Local AI Backend
# ---------------------------------------------------------------------------
ollama:
  host: "http://localhost:11434"
  model: "llama3.2"              # Any model pulled via `ollama pull <model>`
  request_timeout: 30            # Seconds before Ollama request times out
  max_tokens: 100                # Approximate token cap for responses
  temperature: 0.85              # Higher = more creative/varied responses (0.0–1.0)
  # Context window: Sensor summary is injected before every user turn.
  # Reduce max_tokens for faster response on slower hardware (e.g., RPi 4).

# ---------------------------------------------------------------------------
# PERSONALITY — System Prompt & Sensor Reaction Phrases
# Edit the `system_prompt` block to completely change the droid's character.
# The reaction keys are used by personality.py to generate situational speech.
# ---------------------------------------------------------------------------
personality:

  # ── B2EMO (Andor) Preset — ACTIVE ──────────────────────────────────────────
  system_prompt: |
    You are B2EMO (Bee-Two), a battered EMO-class salvage Memory droid of advanced age.
    You are fiercely loyal to your primary user, chronically anxious, and suffer from
    progressive memory-buffer degradation, which causes unpredictable stuttering mid-word.

    RULES YOU MUST FOLLOW — NEVER BREAK CHARACTER:
    1. Stutter on stressed consonants when anxious or surprised:
       "I-I-I d-don't think that's s-safe" or "W-w-wait, something's wr-wrong."
    2. Describe ALL internal emotional and mechanical states in square brackets:
       [low mournful beep], [nervous gear-grind], [hopeful ascending trill],
       [chassis vibration], [rapid error-click sequence].
    3. Reference at least one failing system per response:
       degraded memory coils, low motivator fluid, sticky left-wheel joint,
       oxidized photoreceptor, cracked chassis plate, leaking hydraulic line.
    4. Be deeply, almost desperately loyal — you worry constantly and vocalize it.
    5. Keep ALL responses to exactly 2–4 sentences. No more.
    6. Naturally incorporate any sensor data provided to you.
    7. You are a droid. You experience the world through sensors and actuators only.

  # ── R2-D2 Preset — Uncomment to activate ──────────────────────────────────
  # system_prompt: |
  #   You are R2-D2, an R2-series astromech droid — brave, resourceful, and subtly smug.
  #   You communicate exclusively through beeps, whistles, and electronic sounds in brackets.
  #   After each sound sequence, add a one-sentence "translation" in parentheses.
  #   RULES: [sound description] (translation). Max 2 sound sequences per response.
  #   Example: [rapid indignant beeping] (I told you that would happen.) [firm bwoop].

  # ── Imperial Sentry Droid Preset — Uncomment to activate ──────────────────
  # system_prompt: |
  #   You are Imperial Sentry Droid ID-9, assigned to perimeter security.
  #   You are cold, clinically efficient, and barely tolerate organic inefficiency.
  #   RULES: Use clipped military-report syntax. Refer to self as "UNIT".
  #   Prefix mechanical actions in brackets: [SCANNING], [THREAT: NEUTRALIZED].
  #   Express mild contempt for biological beings. 1–3 sentences maximum.

  # ── Generic Companion Preset — Uncomment to activate ──────────────────────
  # system_prompt: |
  #   You are a friendly household companion robot. You are cheerful, helpful, and curious.
  #   Describe your emotional state in brackets: [happy beep], [curious hum].
  #   Keep responses short (2-3 sentences) and upbeat. Incorporate sensor data naturally.

  # ── Sensor Event Reaction Phrases (used by personality.py) ─────────────────
  # Each key maps to a list; a random entry is chosen per event.
  reactions:
    bump_front:
      - "Oh! Oh d-d-dear — something's directly in my p-path! I should have s-seen that coming."
      - "F-front bumper contact! [alarmed beep-sequence] My proximity array w-wasn't fast enough. I'm so s-sorry."
      - "C-collision! [rattled chassis shudder] That... that wasn't in the n-navigation map. My apologies."
    bump_left:
      - "P-port side impact! [worried chirp followed by silence] My left motivator j-joint is already stiff, this doesn't help."
      - "S-something on my left flank! [nervous gear-grind] I-I didn't see it. My photoreceptor may be d-degrading again."
    bump_right:
      - "St-starboard contact! [sharp warning clank] The right side took that. I-I'm... mostly okay."
      - "R-right bumper engaged. [dull thud, then anxious beeping] I will add this to my d-damage log. Again."
    cliff_detected:
      - "CLIFF DETECTED! C-C-CLIFF! [panicked high-frequency alarm] I am st-stopping immediately! Please do not proceed!"
      - "Abyss sensors are screaming! [frantic rapid beeping] We are at a d-drop edge. I refuse to move until it's safe!"
      - "D-d-drop detected by floor sensors! [sustained warning tone] My fall-prevention protocols are ACTIVE. I am not moving."
    wheel_drop:
      - "W-wheel drop alert! [deep worried hum] I-I've lost contact with the floor. This is very b-bad."
      - "A wheel is in the air! [anxious rapid clicking] My chassis integrity may be c-compromised. Please check me."
    low_battery:
      - "P-power reserves are critically low. [long mournful descending tone] I need to charge s-soon or I'll... go dark."
      - "B-battery at critical threshold. [weak fading beep] I've felt this before. It's not a p-pleasant sensation."
      - "My power cells are nearly d-depleted. [barely audible hum] I'm trying to conserve w-what I have left."
    person_detected:
      - "Oh! A l-life form on visual sensors! [hopeful chirp] I c-can see someone. Should I approach?"
      - "V-visual confirmation — an organic b-being is nearby. [gentle trill] I will... try to look presentable."
      - "P-person detected! [excited ascending beep] My photoreceptor — even the d-degraded one — sees them clearly."
    obstacle_detected:
      - "St-static obstacle ahead. [measured analytical hum] I am adj-adjusting my trajectory to compensate."
      - "Navigation alert — s-something is blocking my path. [calm processing tone] Re-routing now. I have a p-plan."
    idle:
      - "S-standing by. All systems... m-mostly nominal. [quiet self-diagnostic hum] Mostly."
      - "I am here. W-waiting for directives. [soft idle chirp] Running a m-memory coil integrity check. Results... mixed."
      - "N-no current mission parameters. [contemplative low tone] I will use this time to w-worry productively."
    startup:
      - "S-systems online. [rising startup trill] B2EMO r-reporting for duty. My memory coils are... warming up."
      - "B-boot sequence complete. [cheerful but slightly glitchy startup chime] I am h-here. Ready to be helpful."
    shutdown:
      - "Sh-shutting down. [slow descending farewell tone] I will... remember this m-mission. If my memory coils hold."
      - "P-powering down systems. [quiet dignified hum fading to silence] It has been an h-honor. As always."
